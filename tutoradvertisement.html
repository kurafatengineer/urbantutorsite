<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Urbantutorsite — Tuitions Available">
  <title>Urbantutorsite — Tuitions Available</title>

  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="tutorprofile.css">
  <link rel="stylesheet" href="tutoradvertisement.css">
</head>

<body data-page="tutoradvertisement">

<!-- Reusable Header -->
<div id="site-header"></div>

<!-- =====================================================
     LOADING STATE
===================================================== -->

<main id="loadingPage" class="page loading-page">
  <div class="container">
    <div class="spinner" aria-hidden="true"></div>
    <p>Loading open tuitions...</p>
  </div>
</main>

<!-- =====================================================
     TUITIONS PAGE
===================================================== -->

<main id="tuitionsPage" class="page tuitions-page hidden">
  <div class="container">

    <section class="tuitions-hero">
      <div class="tuitions-kicker">Tuitions Available</div>
      <h1>Find your next tuition</h1>
      <p class="tuitions-sub">
        Every open request below has not yet been picked up by a tutor.
        Apply and it's yours.
      </p>
    </section>

    <!-- ================= HORIZONTAL FILTER BAR ================= -->

    <div id="filterPanel" class="tuitions-filterbar">

      <div class="filter-field">
        <select id="subjectFilter" aria-label="Subject">
          <option value="">All subjects</option>
        </select>
      </div>

      <div class="filter-field">
        <select id="boardFilter" aria-label="Board">
          <option value="">All boards</option>
        </select>
      </div>

      <div class="filter-field">
        <select id="cityFilter" aria-label="City">
          <option value="">All cities</option>
        </select>
      </div>

      <div class="filter-field">
        <select id="mediumFilter" aria-label="Medium">
          <option value="">All mediums</option>
        </select>
      </div>

      <div class="filter-field">
        <select id="sortTuitions" aria-label="Sort by">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="subject">Subject (A–Z)</option>
          <option value="city">City (A–Z)</option>
        </select>
      </div>

      <button id="clearFilters" class="clear-filters-button" type="button">
        Clear all
      </button>

    </div>

    <!-- ================= LIST ================= -->

    <div class="tuitions-count" id="tuitionsCount"></div>

    <section class="classes-section">

      <div id="tuitionsList" class="tuitions-grid"></div>

      <div id="tuitionsEmpty" class="filter-empty hidden">
        No open tuitions match these filters right now.
      </div>

    </section>

  </div>
</main>

<!-- =====================================================
     ERROR STATE
===================================================== -->

<main id="errorPage" class="page error-page hidden">
  <div class="container">
    <p id="errorMessage">Something went wrong.</p>
    <button id="retryButton" class="logout-button" type="button">Try again</button>
  </div>
</main>

<!-- =====================================================
     APPLY CONFIRM TOAST
===================================================== -->

<div id="applyToast" class="apply-toast hidden"></div>

<!-- Reusable Footer -->
<div id="site-footer"></div>

<script src="js/header.js"></script>
<script src="js/footer.js"></script>
<script src="tutoradvertisement.js"></script>

</body>
</html>
