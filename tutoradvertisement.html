<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Urbantutorsite — Tuitions Available">
  <title>Urbantutorsite — Tuitions Available</title>

  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="tutorprofile.css">
  <link rel="stylesheet" href="tutoradvertisement.css">
</head>

<body data-page="tutoradvertisement">

<!-- Reusable Header -->
<div id="site-header"></div>

<!-- =====================================================
     LOADING STATE
===================================================== -->

<main id="loadingPage" class="page loading-page">
  <div class="container">
    <div class="spinner" aria-hidden="true"></div>
    <p>Loading open tuitions...</p>
  </div>
</main>

<!-- =====================================================
     TUITIONS PAGE
===================================================== -->

<main id="tuitionsPage" class="page tuitions-page hidden">
  <div class="container">

    <section class="tuitions-hero">
      <div class="tuitions-kicker">Tuitions Available</div>
      <h1>Find your next tuition</h1>
      <p class="tuitions-sub">
        Every open request below has not yet been picked up by a tutor.
        Apply and it's yours.
      </p>
    </section>

    <!-- ================= MOBILE FILTER TOGGLE ================= -->

    <button
      id="filterToggle"
      class="filter-toggle-button"
      type="button"
      aria-expanded="false"
      aria-controls="filterPanel"
    >
      <svg class="filter-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="10" y1="18" x2="14" y2="18"/></svg>
      <span>Filters</span>
      <span id="activeFilterCount" class="filter-badge hidden">0</span>
      <svg class="filter-toggle-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>

    <!-- ================= LAYOUT: SIDEBAR + LIST ================= -->

    <div class="tuitions-layout">

      <aside id="filterPanel" class="filter-sidebar">

        <div class="filter-sidebar-head">
          <h2>Filters</h2>
          <button id="clearFilters" class="clear-filters-button" type="button">
            Clear all
          </button>
        </div>

        <div class="filter-field">
          <label for="subjectFilter">Subject</label>
          <select id="subjectFilter">
            <option value="">All subjects</option>
          </select>
        </div>

        <div class="filter-field">
          <label for="boardFilter">Board</label>
          <select id="boardFilter">
            <option value="">All boards</option>
          </select>
        </div>

        <div class="filter-field">
          <label for="cityFilter">City</label>
          <select id="cityFilter">
            <option value="">All cities</option>
          </select>
        </div>

        <div class="filter-field">
          <label for="mediumFilter">Medium</label>
          <select id="mediumFilter">
            <option value="">All mediums</option>
          </select>
        </div>

        <div class="filter-field">
          <label for="sortTuitions">Sort by</label>
          <select id="sortTuitions">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="subject">Subject (A–Z)</option>
            <option value="city">City (A–Z)</option>
          </select>
        </div>

      </aside>

      <div class="tuitions-main">

        <div class="tuitions-count" id="tuitionsCount"></div>

        <section class="classes-section">

          <div id="tuitionsList" class="tuitions-grid"></div>

          <div id="tuitionsEmpty" class="filter-empty hidden">
            No open tuitions match these filters right now.
          </div>

        </section>

      </div>

    </div>

  </div>
</main>

<!-- =====================================================
     ERROR STATE
===================================================== -->

<main id="errorPage" class="page error-page hidden">
  <div class="container">
    <p id="errorMessage">Something went wrong.</p>
    <button id="retryButton" class="logout-button" type="button">Try again</button>
  </div>
</main>

<!-- =====================================================
     APPLY CONFIRM TOAST
===================================================== -->

<div id="applyToast" class="apply-toast hidden"></div>

<!-- Reusable Footer -->
<div id="site-footer"></div>

<script src="js/header.js"></script>
<script src="js/footer.js"></script>
<script src="tutoradvertisement.js"></script>

</body>
</html>
