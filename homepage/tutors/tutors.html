<!-- =====================================================
     OUR TUTORS COMPONENT
     =====================================================
     This file contains ONLY the HTML structure for the
     Tutors section.

     Tutor data, carousel behaviour and API communication
     are handled by tutors.js.

     Visual styling is handled by tutors.css.

     DO NOT put global Header/Footer code here.
     ===================================================== -->


<section
  id="tutorsSection"
  class="tutors-section"
  aria-labelledby="tutorsTitle"
>


  <!-- ===================================================
       TUTORS SECTION CONTAINER
       =================================================== -->

  <div class="tutors-container">


    <!-- =================================================
         SECTION HEADING
         ================================================= -->

    <header class="tutors-heading">

      <!-- Small section label -->
      <div class="tutors-kicker">
        OUR TUTORS
      </div>


      <!-- Main heading -->
      <h2 id="tutorsTitle">
        Meet our <span>tutors.</span>
      </h2>

    </header>



    <!-- =================================================
         TUTOR CARD AREA
         =================================================
         This area initially contains only the loading
         state.

         JavaScript will replace it with tutor cards once
         the Tutor API responds.
         ================================================= -->

    <div
      id="tutorCardArea"
      class="tutor-card-area"
    >


      <!-- ===============================================
           LOADING STATE
           =============================================== -->

      <div
        id="loadingCard"
        class="loading-card"
      >

        <span
          class="loader"
          aria-hidden="true"
        ></span>

        <p>
          Loading tutors...
        </p>

      </div>



      <!-- ===============================================
           TUTOR GRID
           ===============================================
           Tutor cards are inserted here by tutors.js.
           =============================================== -->

      <div
        id="tutorGrid"
        class="tutor-grid hidden"
        aria-live="polite"
      ></div>



      <!-- ===============================================
           EMPTY STATE
           ===============================================
           This is displayed ONLY when there are no
           verified tutors available.
           =============================================== -->

      <div
        id="noTutors"
        class="no-tutors hidden"
      >

        <div
          class="empty-icon"
          aria-hidden="true"
        >
          —
        </div>

        <h3>
          Tutors coming soon
        </h3>

        <p>
          Qualified tutors will appear here once their
          profiles are verified.
        </p>

      </div>


    </div>



    <!-- =================================================
         CAROUSEL CONTROLS
         =================================================
         Hidden when there is only one tutor.
         ================================================= -->

    <div
      id="tutorControls"
      class="tutor-controls hidden"
    >


      <!-- Previous tutor -->
      <button
        id="previousTutor"
        class="arrow-button"
        type="button"
        aria-label="Previous tutor"
      >
        ←
      </button>



      <!-- Tutor position indicators -->
      <div
        id="tutorDots"
        class="tutor-dots"
        aria-label="Tutor navigation"
      ></div>



      <!-- Next tutor -->
      <button
        id="nextTutor"
        class="arrow-button"
        type="button"
        aria-label="Next tutor"
      >
        →
      </button>


    </div>


  </div>

</section>
