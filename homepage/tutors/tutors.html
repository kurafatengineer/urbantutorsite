<!-- =========================================================
     URBANTUTORSITE
     OUR TUTORS COMPONENT
     =========================================================

     FILE:
     homepage/tutors/tutors.html

     PURPOSE:
     ---------------------------------------------------------
     This file contains ONLY the HTML structure of the
     Tutors section.

     Design  -> tutors.css
     Logic   -> tutors.js

     Header, Footer, Hero and Toggle are NOT controlled here.

     ========================================================= -->


<section
  id="tutorsSection"
  class="tutors-section"
  aria-labelledby="tutorsTitle"
>


  <!-- =======================================================
       MAIN TUTORS CONTAINER
       ======================================================= -->

  <div class="tutors-container">


    <!-- =====================================================
         01. TUTORS HEADING
         =====================================================

         Removed:
         - "OUR TUTORS"
         - Description paragraph
         - Tutor counter (1 / 1)

         Kept:
         - Meet our tutors.
         ===================================================== -->

    <header class="tutors-heading">

      <h2 id="tutorsTitle">
        Meet our <span>tutors.</span>
      </h2>

    </header>



    <!-- =====================================================
         02. TUTOR CARD AREA
         ===================================================== -->

    <div
      id="tutorCardArea"
      class="tutor-card-area"
    >


      <!-- ===================================================
           LOADING STATE

           Hidden automatically after Tutors are loaded.
           =================================================== -->

      <div
        id="loadingCard"
        class="loading-card"
      >

        <span
          class="loader"
          aria-hidden="true"
        ></span>

        <p>
          Loading tutors...
        </p>

      </div>



      <!-- ===================================================
           TUTOR GRID

           Tutor cards are inserted here by tutors.js.

           The number of cards displayed automatically
           depends on the available screen width.
           =================================================== -->

      <div
        id="tutorGrid"
        class="tutor-grid hidden"
        aria-live="polite"
      ></div>



      <!-- ===================================================
           EMPTY / ERROR STATE

           This remains hidden when Tutors are available.

           It appears only when:
           - No Tutors are returned
           - API request fails
           =================================================== -->

      <div
        id="noTutors"
        class="no-tutors hidden"
      >

        <div
          class="empty-icon"
          aria-hidden="true"
        >
          —
        </div>

        <h3>
          Tutors coming soon
        </h3>

        <p>
          Qualified tutors will appear here once their
          profiles are verified.
        </p>

      </div>


    </div>



    <!-- =====================================================
         03. TUTOR NAVIGATION
         =====================================================

         These controls appear only when there is more
         than one Tutor.
         ===================================================== -->

    <div
      id="tutorControls"
      class="tutor-controls hidden"
    >


      <!-- Previous -->

      <button
        id="previousTutor"
        class="arrow-button"
        type="button"
        aria-label="Previous tutor"
      >
        ←
      </button>



      <!-- Position Dots -->

      <div
        id="tutorDots"
        class="tutor-dots"
        aria-label="Tutor position"
      ></div>



      <!-- Next -->

      <button
        id="nextTutor"
        class="arrow-button"
        type="button"
        aria-label="Next tutor"
      >
        →
      </button>


    </div>


  </div>

</section>
