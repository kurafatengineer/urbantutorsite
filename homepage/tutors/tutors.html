<!-- =========================================================
     OUR TUTORS COMPONENT
     =========================================================
     
     This file contains ONLY the structure of the Tutors
     section.

     JavaScript:
       homepage/tutors/tutors.js

     CSS:
       homepage/tutors/tutors.css

     IMPORTANT:
     Do not put API logic or styling inside this file.
     ========================================================= -->


<section
  id="tutorsSection"
  class="tutors-section"
  aria-labelledby="tutorsTitle"
>


  <!-- =======================================================
       SECTION CONTAINER
       ======================================================= -->

  <div class="container">


    <!-- =====================================================
         SECTION HEADING
         ===================================================== -->

    <div class="tutors-heading">

      <!-- Small green heading -->
      <div class="tutors-kicker">
        OUR TUTORS
      </div>


      <!-- Main heading -->
      <h2 id="tutorsTitle">
        Meet our <span>tutors.</span>
      </h2>

    </div>



    <!-- =====================================================
         TUTOR CARD AREA
         =====================================================
         
         JavaScript controls the contents of this area.

         There are three possible states:

         1. Loading
         2. Tutors available
         3. No tutors available
         ===================================================== -->

    <div
      id="tutorCardArea"
      class="tutor-card-area"
    >


      <!-- ===================================================
           LOADING STATE
           =================================================== -->

      <div
        id="tutorLoading"
        class="tutor-state tutor-loading"
        aria-live="polite"
      >

        <span class="tutor-loader"></span>

        <span>
          Loading tutors...
        </span>

      </div>



      <!-- ===================================================
           TUTOR GRID
           ===================================================
           
           Tutor cards are inserted here by tutors.js.
           =================================================== -->

      <div
        id="tutorGrid"
        class="tutor-grid"
        aria-live="polite"
      ></div>



      <!-- ===================================================
           EMPTY STATE
           =================================================== -->

      <div
        id="tutorEmpty"
        class="tutor-state tutor-empty"
        hidden
      >

        <div class="tutor-empty-icon">
          —
        </div>

        <h3>
          Tutors coming soon
        </h3>

        <p>
          Qualified tutors will appear here once
          their profiles are verified.
        </p>

      </div>


    </div>



    <!-- =====================================================
         CAROUSEL CONTROLS
         =====================================================
         
         Hidden automatically when there is only one tutor.
         ===================================================== -->

    <div
      id="tutorControls"
      class="tutor-controls"
      hidden
    >


      <!-- Previous button -->

      <button
        id="previousTutor"
        class="tutor-arrow"
        type="button"
        aria-label="Previous tutors"
      >
        ←
      </button>



      <!-- Pagination dots -->

      <div
        id="tutorDots"
        class="tutor-dots"
        aria-label="Tutor pages"
      ></div>



      <!-- Next button -->

      <button
        id="nextTutor"
        class="tutor-arrow"
        type="button"
        aria-label="Next tutors"
      >
        →
      </button>


    </div>


  </div>

</section>
