<!-- =========================================================
     OUR TUTORS COMPONENT
     =========================================================

     File:
     homepage/tutors/tutors.html

     Purpose:
     - Displays the "Our Tutors" section
     - Provides the structure for the tutor carousel
     - Tutor cards themselves are generated by tutors.js

     Important:
     - Do not put tutor API logic here.
     - Do not put styling here.
     - Do not manually create individual tutor cards here.
     ========================================================= -->


<section
  id="tutorsSection"
  class="tutors-section"
  aria-labelledby="tutorsHeading"
>


  <!-- =======================================================
       TUTORS SECTION CONTAINER
       ======================================================= -->

  <div class="tutors-container">


    <!-- =====================================================
         SECTION HEADING
         ===================================================== -->

    <div class="section-heading">


      <!-- ---------------------------------------------------
           Heading Content
           --------------------------------------------------- -->

      <div class="section-heading-content">

        <!-- Small section label -->
        <div class="kicker">
          OUR TUTORS
        </div>


        <!-- Main heading -->
        <h2 id="tutorsHeading">
          Meet our
          <span>tutors.</span>
        </h2>


        <!-- Description -->
        <p>
          Explore the professional profiles of tutors
          available through Urbantutorsite.
        </p>

      </div>


      <!-- ---------------------------------------------------
           Tutor Counter
           ---------------------------------------------------

           Example:
           1 / 5
           2 / 5
           3 / 5
           --------------------------------------------------- -->

      <div
        id="tutorCounter"
        class="tutor-counter"
        aria-live="polite"
      >
        0 / 0
      </div>

    </div>



    <!-- =====================================================
         TUTOR CARD AREA
         ===================================================== -->

    <div
      id="tutorCardArea"
      class="tutor-card-area"
    >


      <!-- ===================================================
           LOADING STATE
           ===================================================

           Visible while tutor data is being fetched.
           =================================================== -->

      <div
        id="loadingCard"
        class="loading-card"
      >

        <!-- Loading spinner -->
        <span
          class="loader"
          aria-hidden="true"
        ></span>


        <!-- Loading message -->
        <p>
          Loading tutors...
        </p>

      </div>



      <!-- ===================================================
           TUTOR GRID
           ===================================================

           tutors.js will dynamically create tutor cards
           and insert them into this container.
           =================================================== -->

      <div
        id="tutorGrid"
        class="tutor-grid hidden"
        aria-live="polite"
      ></div>



      <!-- ===================================================
           EMPTY / NO TUTORS STATE
           ===================================================

           Displayed when no verified tutors are available.
           =================================================== -->

      <div
        id="noTutors"
        class="no-tutors hidden"
      >

        <!-- Empty-state icon -->
        <div
          class="empty-icon"
          aria-hidden="true"
        >
          —
        </div>


        <!-- Empty-state heading -->
        <h3>
          Tutors coming soon
        </h3>


        <!-- Empty-state description -->
        <p>
          Qualified tutors will appear here once
          their profiles are verified.
        </p>

      </div>

    </div>



    <!-- =====================================================
         CAROUSEL CONTROLS
         =====================================================

         Includes:
         - Previous button
         - Tutor position dots
         - Next button

         tutors.js controls these elements.
         ===================================================== -->

    <div
      id="tutorControls"
      class="tutor-controls hidden"
    >


      <!-- Previous Tutor -->
      <button
        id="previousTutor"
        class="arrow-button"
        type="button"
        aria-label="Previous tutor"
      >
        ←
      </button>


      <!-- Tutor Position Dots -->
      <div
        id="tutorDots"
        class="tutor-dots"
        aria-label="Tutor carousel navigation"
      ></div>


      <!-- Next Tutor -->
      <button
        id="nextTutor"
        class="arrow-button"
        type="button"
        aria-label="Next tutor"
      >
        →
      </button>


    </div>


  </div>

</section>
