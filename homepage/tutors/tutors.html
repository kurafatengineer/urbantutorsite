<!-- =========================================================
     OUR TUTORS COMPONENT
     =========================================================

     File:
     homepage/tutors/tutors.html

     PURPOSE:
     ---------------------------------------------------------
     This file contains ONLY the HTML structure of the
     Tutors section.

     Design  → tutors.css
     API     → tutors.js
     Carousel → tutors.js

     The Tutor cards themselves are created dynamically
     by tutors.js.

     ========================================================= -->


<section
  id="tutorsSection"
  class="tutors-section"
  aria-labelledby="tutorsTitle"
>


  <!-- =======================================================
       MAIN TUTORS CONTAINER
       ======================================================= -->

  <div class="tutors-container">


    <!-- =====================================================
         01. SECTION HEADING
         =====================================================

         "OUR TUTORS" has been removed.

         The supporting paragraph has also been removed.

         Only the main heading remains.
         ===================================================== -->

    <header class="tutors-heading">

      <h2 id="tutorsTitle">
        Meet our <span>tutors.</span>
      </h2>

    </header>



    <!-- =====================================================
         02. TUTOR CONTENT AREA
         =====================================================

         IMPORTANT:

         The loading and empty states are hidden by default
         using the .hidden class.

         tutors.js controls which state is visible.
         ===================================================== -->

    <div
      id="tutorCardArea"
      class="tutor-card-area"
    >


      <!-- ===================================================
           LOADING STATE
           =================================================== -->

      <div
        id="loadingCard"
        class="loading-card hidden"
      >

        <span
          class="loader"
          aria-hidden="true"
        ></span>

        <p>
          Loading tutors...
        </p>

      </div>



      <!-- ===================================================
           TUTOR GRID
           ===================================================

           tutors.js inserts all Tutor cards here.

           The CSS automatically determines how many cards
           can fit on the current screen.
           =================================================== -->

      <div
        id="tutorGrid"
        class="tutor-grid hidden"
        aria-live="polite"
      ></div>



      <!-- ===================================================
           NO TUTORS / EMPTY STATE
           ===================================================

           This remains hidden unless the API returns
           zero Tutors or an error occurs.
           =================================================== -->

      <div
        id="noTutors"
        class="no-tutors hidden"
      >

        <div
          class="empty-icon"
          aria-hidden="true"
        >
          —
        </div>

        <h3>
          Tutors coming soon
        </h3>

        <p>
          Qualified tutors will appear here once their
          profiles are verified.
        </p>

      </div>


    </div>



    <!-- =====================================================
         03. CAROUSEL CONTROLS
         =====================================================

         These controls are only displayed when required.
         ===================================================== -->

    <div
      id="tutorControls"
      class="tutor-controls hidden"
    >

      <!-- Previous Tutor -->

      <button
        id="previousTutor"
        class="arrow-button"
        type="button"
        aria-label="Previous tutor"
      >
        ←
      </button>



      <!-- Position Indicators -->

      <div
        id="tutorDots"
        class="tutor-dots"
        aria-label="Tutor carousel position"
      ></div>



      <!-- Next Tutor -->

      <button
        id="nextTutor"
        class="arrow-button"
        type="button"
        aria-label="Next tutor"
      >
        →
      </button>

    </div>


  </div>

</section>
