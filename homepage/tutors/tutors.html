<!-- =========================================================
     OUR TUTORS COMPONENT
     =========================================================

     File:
     homepage/tutors/tutors.html

     Purpose:
     - Contains ONLY the HTML structure of the Tutors section.
     - No Tutor styling is written here.
     - No API logic is written here.
     - Tutor data is inserted dynamically by tutors.js.

     Structure:

     Tutors Section
         │
         ├── Section Heading
         │     └── Meet our tutors.
         │
         ├── Tutor Card Area
         │     ├── Loading State
         │     ├── Tutor Grid
         │     └── Empty State
         │
         └── Carousel Controls

     ========================================================= -->


<section
  id="tutorsSection"
  class="tutors-section"
  aria-labelledby="tutorsTitle"
>


  <!-- =======================================================
       TUTORS SECTION CONTAINER
       ======================================================= -->

  <div class="container">


    <!-- =====================================================
         01. SECTION HEADING
         =====================================================

         "OUR TUTORS" has been removed.

         The description has also been removed.

         Only the main heading remains and is centered.
         ===================================================== -->

    <div class="section-heading">

      <h2 id="tutorsTitle">
        Meet our <span>tutors.</span>
      </h2>

    </div>



    <!-- =====================================================
         02. TUTOR CARD AREA
         ===================================================== -->

    <div
      id="tutorCardArea"
      class="tutor-card-area"
    >


      <!-- ===================================================
           LOADING STATE
           =================================================== -->

      <div
        id="loadingCard"
        class="loading-card"
      >

        <span
          class="loader"
          aria-hidden="true"
        ></span>

        <p>Loading tutors...</p>

      </div>



      <!-- ===================================================
           TUTOR GRID
           ===================================================

           tutors.js dynamically creates Tutor cards
           inside this container.
           =================================================== -->

      <div
        id="tutorGrid"
        class="tutor-grid hidden"
        aria-live="polite"
      ></div>



      <!-- ===================================================
           EMPTY STATE
           =================================================== -->

      <div
        id="noTutors"
        class="no-tutors hidden"
      >

        <div
          class="empty-icon"
          aria-hidden="true"
        >
          —
        </div>

        <h3>
          Tutors coming soon
        </h3>

        <p>
          Qualified tutors will appear here once their
          profiles are verified.
        </p>

      </div>


    </div>



    <!-- =====================================================
         03. TUTOR CAROUSEL CONTROLS
         =====================================================

         The controls are automatically hidden when there
         is only one Tutor.
         ===================================================== -->

    <div
      id="tutorControls"
      class="tutor-controls hidden"
    >

      <button
        id="previousTutor"
        class="arrow-button"
        type="button"
        aria-label="Previous tutor"
      >
        ←
      </button>


      <div
        id="tutorDots"
        class="tutor-dots"
        aria-label="Tutor carousel position"
      ></div>


      <button
        id="nextTutor"
        class="arrow-button"
        type="button"
        aria-label="Next tutor"
      >
        →
      </button>

    </div>


  </div>

</section>
