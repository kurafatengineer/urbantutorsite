<!-- =====================================================
     TUTORS COMPONENT
     File:
     homepage/tutors/tutors.html

     PURPOSE:
     -----------------------------------------------------
     This file contains ONLY the HTML structure of the
     Tutors section.

     Tutor data, cards and carousel behaviour are handled
     separately by tutors.js.

     Styling is handled separately by tutors.css.
     ===================================================== -->


<section
  id="tutorsSection"
  class="tutors-section"
  aria-labelledby="tutorsTitle"
>


  <!-- ===================================================
       TUTORS SECTION CONTAINER
       =================================================== -->

  <div class="tutors-container">


    <!-- =================================================
         SECTION HEADING
         -------------------------------------------------
         Only the main heading is kept.

         "OUR TUTORS" and the descriptive paragraph have
         intentionally been removed.
         ================================================= -->

    <header class="tutors-heading">

      <h2 id="tutorsTitle">
        Meet our <span>tutors.</span>
      </h2>

    </header>



    <!-- =================================================
         TUTOR CAROUSEL
         ================================================= -->

    <div
      class="tutor-carousel"
      aria-roledescription="carousel"
      aria-label="Our tutors"
    >


      <!-- ===============================================
           PREVIOUS BUTTON
           =============================================== -->

      <button
        id="previousTutor"
        class="tutor-arrow tutor-arrow-previous"
        type="button"
        aria-label="Previous tutors"
      >

        <span aria-hidden="true">
          ←
        </span>

      </button>



      <!-- ===============================================
           CAROUSEL VIEWPORT
           ------------------------------------------------
           Only the cards inside this area are visible.
           The track moves horizontally inside it.
           =============================================== -->

      <div class="tutor-viewport">


        <!-- =============================================
             LOADING STATE
             ------------------------------------------------
             This is visible ONLY while the API is loading.

             Once tutors arrive, JavaScript completely hides
             this element.
             ============================================= -->

        <div
          id="tutorLoading"
          class="tutor-loading"
        >

          <span
            class="tutor-loader"
            aria-hidden="true"
          ></span>

          <p>
            Loading tutors...
          </p>

        </div>



        <!-- =============================================
             TUTOR TRACK
             ------------------------------------------------
             All tutor cards are inserted here by tutors.js.
             ============================================= -->

        <div
          id="tutorTrack"
          class="tutor-track"
          aria-live="polite"
        ></div>



        <!-- =============================================
             EMPTY STATE
             ------------------------------------------------
             This is shown ONLY when there are genuinely
             no tutors returned by the API.

             It will NOT appear beside actual tutor cards.
             ============================================= -->

        <div
          id="tutorEmpty"
          class="tutor-empty"
          hidden
        >

          <div
            class="tutor-empty-icon"
            aria-hidden="true"
          >
            —
          </div>

          <h3>
            Tutors coming soon
          </h3>

          <p>
            Qualified tutors will appear here once their
            profiles are verified.
          </p>

        </div>


      </div>



      <!-- ===============================================
           NEXT BUTTON
           =============================================== -->

      <button
        id="nextTutor"
        class="tutor-arrow tutor-arrow-next"
        type="button"
        aria-label="Next tutors"
      >

        <span aria-hidden="true">
          →
        </span>

      </button>


    </div>



    <!-- =================================================
         CAROUSEL DOTS
         -------------------------------------------------
         The old "1 / 1" counter has been completely
         removed.

         These dots indicate the current tutor position.
         ================================================= -->

    <div
      id="tutorControls"
      class="tutor-controls"
      hidden
    >

      <div
        id="tutorDots"
        class="tutor-dots"
        role="tablist"
        aria-label="Tutor navigation"
      ></div>

    </div>


  </div>

</section>
