
<!-- =========================================================
     MEET OUR STUDENTS
     ========================================================= -->

<section
  id="studentsSection"
  class="students-section"
  aria-labelledby="studentsTitle"
>

  <div class="students-container">

    <!-- =====================================================
         SECTION HEADING
         ===================================================== -->

    <div class="students-heading">

      <div class="students-heading-content">

        <div class="students-kicker">
          OUR STUDENTS
        </div>

        <h2 id="studentsTitle">
          Meet our <span>students.</span>
        </h2>

        <p>
          Discover students who are looking for the right
          learning support through UrbanTutorSite.
        </p>

      </div>

      <div
        id="studentCounter"
        class="student-counter"
      >
        0 / 0
      </div>

    </div>


    <!-- =====================================================
         STUDENT CARD AREA
         ===================================================== -->

    <div
      id="studentCardArea"
      class="student-card-area"
    >

      <!-- Loading -->

      <div
        id="studentLoading"
        class="student-loading"
      >

        <span class="student-loader"></span>

        <p>
          Loading students...
        </p>

      </div>


      <!-- Cards -->

      <div
        id="studentGrid"
        class="student-grid"
        aria-live="polite"
      ></div>


      <!-- Empty state -->

      <div
        id="noStudents"
        class="no-students hidden"
      >

        <div class="student-empty-icon">
          —
        </div>

        <h3>
          Students coming soon
        </h3>

        <p>
          Student profiles will appear here once
          students register on UrbanTutorSite.
        </p>

      </div>

    </div>


    <!-- =====================================================
         CAROUSEL CONTROLS
         ===================================================== -->

    <div
      id="studentControls"
      class="student-controls hidden"
    >

      <button
        id="previousStudent"
        class="student-arrow"
        type="button"
        aria-label="Previous students"
      >
        ←
      </button>

      <div
        id="studentDots"
        class="student-dots"
      ></div>

      <button
        id="nextStudent"
        class="student-arrow"
        type="button"
        aria-label="Next students"
      >
        →
      </button>

    </div>

  </div>

</section>
