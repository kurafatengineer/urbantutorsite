<!-- =====================================================
     STUDENTS COMPONENT
     File: homepage/students/students.html

     PURPOSE:
     -----------------------------------------------------
     This file contains ONLY the HTML structure of the
     Students section. It mirrors tutors.html.

     Student data, cards and carousel behaviour are handled
     by students.js.

     Styling is handled by students.css.
     ===================================================== -->


<section
  id="studentsSection"
  class="students-section"
  aria-labelledby="studentsTitle"
>


  <!-- ===================================================
       STUDENTS SECTION CONTAINER
       =================================================== -->

  <div class="students-container">


    <!-- =================================================
         SECTION HEADING
         -------------------------------------------------
         Only the main heading is kept.
         ================================================= -->

    <header class="students-heading">

      <h2 id="studentsTitle">
        Meet our <span>students.</span>
      </h2>

    </header>



    <!-- =================================================
         STUDENT CAROUSEL
         ================================================= -->

    <div
      class="student-carousel"
      aria-roledescription="carousel"
      aria-label="Our students"
    >


      <!-- PREVIOUS BUTTON -->

      <button
        id="previousStudent"
        class="student-arrow student-arrow-previous"
        type="button"
        aria-label="Previous students"
      >

        <span aria-hidden="true">
          ←
        </span>

      </button>



      <!-- ===============================================
           CAROUSEL VIEWPORT
           Only the cards inside this area are visible.
           The track moves horizontally inside it.
           =============================================== -->

      <div class="student-viewport">


        <!-- LOADING STATE (visible only while loading) -->

        <div
          id="studentLoading"
          class="student-loading"
        >

          <span
            class="student-loader"
            aria-hidden="true"
          ></span>

          <p>
            Loading students...
          </p>

        </div>



        <!-- STUDENT TRACK (cards are inserted by students.js) -->

        <div
          id="studentTrack"
          class="student-track"
          aria-live="polite"
        ></div>



        <!-- EMPTY / ERROR STATE (text is set by students.js) -->

        <div
          id="studentEmpty"
          class="student-empty"
          hidden
        >

          <div
            id="studentEmptyIcon"
            class="student-empty-icon"
            aria-hidden="true"
          >
            —
          </div>

          <h3 id="studentEmptyTitle">
            Students coming soon
          </h3>

          <p id="studentEmptyText">
            Student profiles will appear here once
            students register on UrbanTutorSite.
          </p>

        </div>


      </div>



      <!-- NEXT BUTTON -->

      <button
        id="nextStudent"
        class="student-arrow student-arrow-next"
        type="button"
        aria-label="Next students"
      >

        <span aria-hidden="true">
          →
        </span>

      </button>


    </div>



    <!-- =================================================
         CAROUSEL DOTS
         ================================================= -->

    <div
      id="studentControls"
      class="student-controls"
      hidden
    >

      <div
        id="studentDots"
        class="student-dots"
        role="tablist"
        aria-label="Student navigation"
      ></div>

    </div>


  </div>

</section>
