<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <!-- Desktop mode on every device: phones / tablets show the full
       1200px desktop layout, scaled to fit (pinch to zoom). -->
  <meta name="viewport" content="width=1200">
  <meta name="theme-color" content="#050505">
  <meta name="robots" content="noindex, nofollow">
  <title>Urbantutorsite — Admin Panel</title>

  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/photos.css?v=20261002a">
  <link rel="stylesheet" href="css/pages/admin.css?v=20261001h">
</head>

<body data-page="admin">

<!-- Reusable Header -->
<div id="site-header"></div>

<!-- =====================================================
     LOGIN
===================================================== -->

<main id="loginPage" class="admin-page hidden">
  <div class="admin-container admin-login-wrap">

    <section class="admin-login">
      <div class="admin-login-badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      </div>
      <p class="muted" id="loginSubtitle">Office access only.</p>

      <!-- STEP 1: email -->
      <form id="emailStepForm" novalidate>
        <label class="admin-float">
          <input id="adminEmail" type="email" autocomplete="username" placeholder=" " required>
          <span>Work Email</span>
        </label>
        <p id="emailMessage" class="admin-message" role="alert"></p>
        <button id="sendCodeButton" class="admin-primary" type="submit">Send code</button>
      </form>

      <!-- STEP 2: OTP -->
      <form id="otpStepForm" class="hidden" novalidate>
        <p class="muted" style="margin:0 0 14px;font-size:13.5px;text-align:center;">
          Code sent to <strong id="otpEmailDisplay"></strong>.
        </p>
        <!-- six equal blocks, one digit each; the sixth digit logs in by itself -->
        <div id="otpBoxes" class="otp-boxes" role="group" aria-label="6-digit code">
          <input class="otp-box" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="Digit 1">
          <input class="otp-box" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2">
          <input class="otp-box" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 3">
          <input class="otp-box" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4">
          <input class="otp-box" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 5">
          <input class="otp-box" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 6">
        </div>
        <p id="otpMessage" class="admin-message" role="alert"></p>
        <div class="admin-pair admin-otp-actions" style="margin-top:8px;">
          <button id="otpBackButton" class="admin-ghost" type="button">Change Email</button>
          <button id="resendCodeButton" class="admin-ghost" type="button">Resend Code</button>
        </div>
      </form>

      <!-- STEP 3: first-time super admin setup (only when no admin account exists yet) -->
      <form id="bootstrapStepForm" class="hidden" novalidate>
        <p class="muted" style="margin:0 0 14px;font-size:13.5px;">
          No admin account exists yet. Set yourself up as the first Super Admin.
        </p>
        <label class="admin-float">
          <input id="bootstrapName" type="text" autocomplete="name" placeholder=" " required>
          <span>Your Full Name</span>
        </label>
        <p id="bootstrapMessage" class="admin-message" role="alert"></p>
        <button id="bootstrapButton" class="admin-primary" type="submit">Create Super Admin account</button>
      </form>
    </section>

  </div>
</main>

<!-- =====================================================
     LOADING
===================================================== -->

<main id="loadingPage" class="admin-page">
  <div class="admin-container admin-center">
    <div class="admin-spinner" aria-hidden="true"></div>
    <p class="muted">Loading...</p>
  </div>
</main>

<!-- =====================================================
     PANEL
===================================================== -->

<main id="panelPage" class="admin-page hidden">
  <div class="admin-container">

    <!-- Refresh (left) | signed-in-as name + role (centre) | Log out (right) -->
    <header class="admin-top admin-top-3">
      <button id="refreshButton" class="admin-ghost" type="button">Refresh</button>
      <div class="admin-top-mid">
        <div class="admin-me" id="adminMe"></div>
      </div>
      <button id="logoutButton" class="admin-ghost admin-danger" type="button">Log out</button>
    </header>

    <!-- counts -->
    <section class="admin-stats" id="adminStats"></section>

    <!-- main tabs -->
    <div class="admin-tabs" id="mainTabs" role="tablist">
      <button class="admin-tab active" data-tab="tuitions" type="button" role="tab">Tuitions</button>
      <button class="admin-tab" data-tab="tutors" type="button" role="tab">Tutors</button>
      <button class="admin-tab" data-tab="students" type="button" role="tab">Students</button>
      <button class="admin-tab hidden" data-tab="payments" data-role-tab="payments" type="button" role="tab">Payments</button>
      <button class="admin-tab hidden" data-tab="subscriptions" data-role-tab="payments" type="button" role="tab">Subscriptions</button>
      <button class="admin-tab hidden" data-tab="ledger" data-role-tab="payments" type="button" role="tab">Ledger</button>
      <button class="admin-tab hidden" data-tab="employees" data-role-tab="employees" type="button" role="tab">Employees</button>
      <button class="admin-tab hidden" data-tab="graph" data-role-tab="payments" type="button" role="tab">Graph</button>
    </div>

    <!-- ================= TUITIONS ================= -->
    <section id="tab-tuitions" class="admin-panel">
      <div class="admin-tools">
        <label class="admin-float admin-search-wrap">
          <input id="tuitionSearch" type="search" placeholder=" " autocomplete="off">
          <span>Search</span>
        </label>
        <div class="admin-chips admin-chips-7" id="tuitionFilter">
          <button class="admin-chip active" data-value="all" type="button">All</button>
          <button class="admin-chip" data-value="new" type="button">Finding Tutors</button>
          <button class="admin-chip" data-value="schedule" type="button">Schedule Demo</button>
          <button class="admin-chip" data-value="scheduled" type="button">Demo Scheduled</button>
          <button class="admin-chip" data-value="running" type="button">Running</button>
          <button class="admin-chip" data-value="completed" type="button">Completed</button>
          <button class="admin-chip" data-value="terminated" type="button">Closed</button>
        </div>
      </div>
      <div id="tuitionList" class="admin-stack-list"></div>
    </section>

    <!-- ================= TUTORS ================= -->
    <section id="tab-tutors" class="admin-panel hidden">
      <div class="admin-tools">
        <label class="admin-float admin-search-wrap">
          <input id="tutorSearch" type="search" placeholder=" " autocomplete="off">
          <span>Search</span>
        </label>
        <div class="admin-chips admin-chips-4" id="tutorFilter">
          <button class="admin-chip active" data-value="all" type="button">All</button>
          <button class="admin-chip" data-value="pending" type="button">Pending for Verification</button>
          <button class="admin-chip" data-value="verified" type="button">Verified</button>
          <button class="admin-chip" data-value="rejected" type="button">Rejected</button>
        </div>
      </div>
      <div id="tutorHeader"></div>
      <div id="tutorList" class="admin-stack-list"></div>
    </section>

    <!-- ================= STUDENTS ================= -->
    <section id="tab-students" class="admin-panel hidden">
      <div class="admin-tools">
        <label class="admin-float admin-search-wrap">
          <input id="studentSearch" type="search" placeholder=" " autocomplete="off">
          <span>Search</span>
        </label>
      </div>
      <div id="studentHeader"></div>
      <div id="studentList" class="admin-stack-list"></div>
    </section>

    <!-- ================= PAYMENTS ================= -->
    <section id="tab-payments" class="admin-panel hidden">

      <div class="admin-tools">
        <label class="admin-float admin-search-wrap">
          <input id="paymentSearch" type="search" placeholder=" " autocomplete="off">
          <span>Search by Demo ID, student, tutor</span>
        </label>
      </div>

      <button id="addPaymentButton" class="admin-ghost admin-wide" type="button" style="margin-bottom:14px;">+ Record a Payment</button>

      <form id="paymentForm" class="admin-card hidden" novalidate style="margin-bottom:14px;">
        <h3 class="admin-section-title">New Payment</h3>
        <p id="paymentForSubscription" class="admin-note hidden"></p>
        <input id="paymentSubscriptionId" type="hidden">
        <div class="admin-form">

          <!-- Empty slots an Agency Charge payment's own fields get
               moved into (see layoutAgencyChargeFields in admin.js) -
               every other transaction type (Subscription included)
               keeps its original flat field order below untouched. -->
          <div class="admin-form-row admin-form-row-3 hidden" id="agencySlotTop"></div>
          <div class="admin-form-row admin-form-row-3 hidden" id="agencySlotDemo">
            <label class="admin-float" id="paymentStudentMobileField">
              <input id="paymentStudentMobile" type="text" readonly>
              <span>Student Mobile Number</span>
            </label>
            <label class="admin-float" id="paymentStudentNameField">
              <input id="paymentStudentName" type="text" readonly>
              <span>Name</span>
            </label>
          </div>
          <div class="admin-form-row admin-form-row-3 hidden" id="slotStudent">
            <label class="admin-float" id="paymentStuIdField">
              <input id="paymentStuId" type="text" readonly>
              <span>Student ID</span>
            </label>
            <label class="admin-float" id="paymentStuWhatsappField">
              <input id="paymentStuWhatsapp" type="text" readonly>
              <span>WhatsApp Number</span>
            </label>
            <label class="admin-float" id="paymentParentNameField">
              <input id="paymentParentName" type="text" readonly>
              <span>Parent Name</span>
            </label>
          </div>
          <div class="admin-form-row admin-form-row-3 hidden" id="slotTutor">
            <label class="admin-float" id="paymentTutorMobileField">
              <input id="paymentTutorMobile" type="text" readonly>
              <span>Mobile Number</span>
            </label>
            <label class="admin-float" id="paymentTutorNameField">
              <input id="paymentTutorName" type="text" readonly>
              <span>Name</span>
            </label>
          </div>
          <div class="admin-form-row admin-form-row-3 hidden" id="agencySlotParty"></div>
          <div class="admin-form-row admin-form-row-3 hidden" id="slotSubPlan"></div>
          <div class="admin-form-row admin-form-row-3 hidden" id="agencySlotAmount"></div>
          <div class="admin-form-row admin-form-row-3 hidden" id="slotSubDates"></div>
          <div class="admin-form-row hidden" id="slotSubNotes"></div>
          <div class="admin-form-row admin-form-row-notes hidden" id="agencySlotNotes">
            <label class="admin-float" id="paymentNextDateField">
              <input id="paymentNextDate" type="date">
              <span>Next Payment Date</span>
            </label>
          </div>

          <label class="admin-float is-select" id="paymentTransactionTypeField">
            <select id="paymentTransactionType">
              <option value="payout">Payout (Tutor)</option>
              <option value="collection">Collection (Parent)</option>
              <option value="tutor-subscription">Subscription (Tutor)</option>
              <option value="student-subscription">Subscription (Student)</option>
              <option value="student-agency-charge">Agency Charge (Student)</option>
              <option value="tutor-agency-charge">Agency Charge (Tutor)</option>
            </select>
            <span>Transaction</span>
          </label>
          <label class="admin-float hidden" id="paymentReceivedByField">
            <input id="paymentReceivedBy" type="text" placeholder=" ">
            <span>Received By</span>
          </label>

          <label class="admin-float hidden" id="paymentSubNameField">
            <input id="paymentSubName" type="text" readonly>
            <span id="paymentSubNameLabel">Name</span>
          </label>
          <label class="admin-float hidden" id="paymentSubMobileField">
            <input id="paymentSubMobile" type="text" readonly>
            <span>Mobile Number</span>
          </label>
          <!-- Typed into directly for a Subscription (with suggestions);
               filled in, read-only, for an Agency Charge. -->
          <div class="admin-id-row hidden" id="paymentSubIdField">
            <label class="admin-float">
              <input id="paymentSubId" type="text" readonly autocomplete="off">
              <span id="paymentSubIdLabel">Student ID</span>
            </label>
            <div class="admin-suggest hidden" data-suggest="subparty"></div>
          </div>
          <label class="admin-float hidden" id="paymentSubPlanField">
            <input id="paymentSubPlan" type="text" readonly>
            <span>Plan Name</span>
          </label>
          <label class="admin-float hidden" id="paymentSubCycleField">
            <input id="paymentSubCycle" type="text" readonly>
            <span>Billing Cycle</span>
          </label>
          <label class="admin-float hidden" id="paymentSubStatusField">
            <input id="paymentSubStatus" type="text" readonly>
            <span>Status</span>
          </label>
          <label class="admin-float hidden" id="paymentSubStartDateField">
            <input id="paymentSubStartDate" type="date" readonly>
            <span>Start Date</span>
          </label>
          <label class="admin-float hidden" id="paymentSubNextDueField">
            <input id="paymentSubNextDue" type="date" readonly>
            <span>Next Due Date</span>
          </label>

          <!-- Demo ID and Tutor ID share one line; each has its own
               search-as-you-type suggestions and, once resolved, a
               name + mobile number line so it can be verified. -->
          <div class="admin-id-row" id="paymentDemoIdField">
            <label class="admin-float">
              <input id="paymentDemoId" type="text" placeholder=" " autocomplete="off">
              <span>Demo ID</span>
            </label>
            <div class="admin-suggest hidden" data-suggest="demo"></div>
            <p class="admin-id-detail hidden" id="paymentDemoDetail"></p>
          </div>

          <div class="admin-id-row" id="paymentTutorIdField">
            <label class="admin-float">
              <input id="paymentTutorId" type="text" placeholder=" " autocomplete="off">
              <span>Tutor ID</span>
            </label>
            <div class="admin-suggest hidden" data-suggest="tutor"></div>
            <p class="admin-id-detail hidden" id="paymentTutorDetail"></p>
          </div>

          <label class="admin-float is-select" id="paymentTypeField">
            <select id="paymentType">
              <option value="regular">Regular</option>
              <option value="advance">Advance</option>
              <option value="final">Final</option>
            </select>
            <span>Payment Type</span>
          </label>
          <label class="admin-float" id="paymentAmountField">
            <input id="paymentAmount" type="number" min="1" step="1" placeholder=" ">
            <span>Amount (₹)</span>
          </label>
          <label class="admin-float" id="paymentDateField">
            <input id="paymentDate" type="date" placeholder=" ">
            <span>Payment Date</span>
          </label>
          <div class="admin-float is-select admin-mode-field" id="paymentModeField">
            <div class="admin-mode-seg" role="radiogroup" aria-label="Payment Mode">
              <label>
                <input type="radio" name="paymentModeChoice" id="paymentModeOnline" value="Online" checked>
                <span class="admin-mode-opt"><i class="admin-mode-dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></i>Online</span>
              </label>
              <label>
                <input type="radio" name="paymentModeChoice" id="paymentModeOffline" value="Offline">
                <span class="admin-mode-opt"><i class="admin-mode-dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></i>Offline</span>
              </label>
            </div>
            <span>Payment Mode</span>
          </div>
          <label class="admin-float is-select" id="collectedByField">
            <select id="paymentCollectedBy">
              <option value="agency">Agency (we received it)</option>
              <option value="tutor">Tutor (we only get our cut) — parent paid the tutor directly</option>
            </select>
            <span>Collected By</span>
          </label>
          <label class="admin-float" id="ourCutField">
            <input id="paymentOurCut" type="number" min="0" step="1" placeholder=" ">
            <span>Our Cut Amount (₹)</span>
          </label>

          <!-- Amount/Dues/Paying Now/Remaining sit right above Notes -->
          <label class="admin-float hidden" id="paymentSubAmountField">
            <input id="paymentSubAmount" type="text" readonly>
            <span>Amount (₹)</span>
          </label>
          <label class="admin-float hidden" id="paymentSubDuesField">
            <input id="paymentSubDues" type="text" readonly>
            <span>Dues (₹)</span>
          </label>
          <label class="admin-float hidden" id="paymentPayingNowField">
            <input id="paymentPayingNow" type="number" min="0" step="1" placeholder=" ">
            <span>Paying Now (₹)</span>
          </label>
          <label class="admin-float hidden" id="paymentRemainingField">
            <input id="paymentRemaining" type="text" readonly>
            <span>Remaining (₹)</span>
          </label>

          <label class="admin-float wide" id="paymentNotesField">
            <textarea id="paymentNotes" rows="2" placeholder=" "></textarea>
            <span>Notes</span>
          </label>

        </div>
        <div class="admin-pair" style="margin-top:12px;">
          <button class="admin-primary" type="submit">Save Payment</button>
          <button id="cancelPaymentButton" class="admin-ghost" type="button">Cancel</button>
        </div>
      </form>

      <div id="paymentHeader"></div>
      <div id="paymentList" class="admin-stack-list"></div>

    </section>

    <!-- ================= SUBSCRIPTIONS ================= -->
    <section id="tab-subscriptions" class="admin-panel hidden">

      <div class="admin-tools">
        <label class="admin-float admin-search-wrap">
          <input id="subscriptionSearch" type="search" placeholder=" " autocomplete="off">
          <span>Search by student, tutor, plan</span>
        </label>
      </div>

      <button id="addSubscriptionButton" class="admin-ghost admin-wide" type="button" style="margin-bottom:14px;">+ Create a Subscription</button>

      <form id="subscriptionForm" class="admin-card hidden" style="margin-bottom:14px;">
        <h3 class="admin-section-title">New Subscription</h3>
        <div class="admin-form">
          <div class="admin-form-row admin-form-row-3">
            <label class="admin-float is-select">
              <select id="subscriptionPartyType">
                <option value="student">Student Subscription</option>
                <option value="tutor">Tutor Subscription</option>
              </select>
              <span>Transaction</span>
            </label>
            <label class="admin-float">
              <input id="subscriptionPlanName" type="text" required placeholder=" ">
              <span>Plan Name</span>
            </label>
            <label class="admin-float">
              <input id="subscriptionBillingCycle" type="text" required placeholder=" " value="Monthly">
              <span>Billing Cycle</span>
            </label>
          </div>
          <div class="admin-form-row admin-form-row-3">
            <div class="admin-id-row" id="subscriptionPartyIdField">
              <label class="admin-float">
                <input id="subscriptionPartyId" type="text" required placeholder=" " autocomplete="off">
                <span id="subscriptionPartyIdLabel">Student ID</span>
              </label>
              <div class="admin-suggest hidden" data-suggest="party"></div>
              <p class="admin-id-detail hidden" id="subscriptionPartyDetail"></p>
            </div>
            <label class="admin-float">
              <input id="subscriptionAmount" type="number" min="0" step="1" placeholder=" " required>
              <span>Amount (₹)</span>
            </label>
            <label class="admin-float">
              <input id="subscriptionStartDate" type="date" placeholder=" ">
              <span>Start Date</span>
            </label>
          </div>
          <div class="admin-form-row admin-form-row-3">
            <label class="admin-float wide" style="grid-column: span 2;">
              <textarea id="subscriptionNotes" rows="2" placeholder=" "></textarea>
              <span>Notes</span>
            </label>
            <label class="admin-float">
              <input id="subscriptionNextDueDate" type="date" placeholder=" ">
              <span>Next Due Date</span>
            </label>
          </div>
        </div>
        <div class="admin-pair" style="margin-top:12px;">
          <button class="admin-primary" type="submit">Save Subscription</button>
          <button id="cancelSubscriptionButton" class="admin-ghost" type="button">Cancel</button>
        </div>
      </form>

      <div id="subscriptionHeader"></div>
      <div id="subscriptionList" class="admin-stack-list"></div>

    </section>

    <!-- ================= LEDGER ================= -->
    <!-- Every payment already made and every one still due, in one list. -->
    <section id="tab-ledger" class="admin-panel hidden">
      <div class="admin-tools">
        <label class="admin-float admin-search-wrap">
          <input id="ledgerSearch" type="search" placeholder=" " autocomplete="off">
          <span>Search</span>
        </label>
        <div class="admin-chips admin-chips-4" id="ledgerFilter">
          <button class="admin-chip active" data-value="all" type="button">All</button>
          <button class="admin-chip" data-value="upcoming" type="button">Upcoming</button>
          <button class="admin-chip" data-value="overdue" type="button">Overdue</button>
          <button class="admin-chip" data-value="paid" type="button">Paid</button>
        </div>
      </div>
      <div id="ledgerHeader"></div>
      <div id="ledgerList" class="admin-stack-list"></div>
    </section>

    <!-- ================= EMPLOYEES ================= -->
    <section id="tab-employees" class="admin-panel hidden">

      <button id="addEmployeeButton" class="admin-ghost admin-wide" type="button" style="margin-bottom:14px;">+ Add Employee</button>

      <form id="employeeForm" class="admin-card hidden" style="margin-bottom:14px;">
        <h3 class="admin-section-title">New Employee</h3>
        <div class="admin-form">
          <div class="admin-form-row admin-form-row-3">
            <label class="admin-float">
              <input id="employeeEmail" type="email" required placeholder=" ">
              <span>Email</span>
            </label>
            <label class="admin-float">
              <input id="employeeName" type="text" required placeholder=" ">
              <span>Full Name</span>
            </label>
            <label class="admin-float is-select">
              <select id="employeeRole">
                <option value="tuition_coordinator">Tuition Coordinator</option>
                <option value="verification_staff">Verification Staff</option>
                <option value="accounts_finance">Accounts / Finance</option>
                <option value="tutor_relations">Tutor Relations / Recruiter</option>
                <option value="super_admin">Super Admin</option>
              </select>
              <span>Role</span>
            </label>
          </div>
          <div class="perm-box">
            <p class="perm-title">Permissions <small>- tick only what this employee should be able to do (picking a Role fills in its usual set)</small></p>
            <div id="employeePerms" class="perm-grid"></div>
          </div>
        </div>
        <div class="admin-pair" style="margin-top:12px;">
          <button class="admin-primary" type="submit">Add Employee</button>
          <button id="cancelEmployeeButton" class="admin-ghost" type="button">Cancel</button>
        </div>
      </form>

      <div id="employeeHeader"></div>
      <div id="employeeList" class="admin-stack-list"></div>
    </section>

    <!-- ================= GRAPH ================= -->
    <!-- Money in vs out over time, plus outstanding dues - built from
         the same paid/due entries the Ledger uses (see ledgerEntries),
         just totalled instead of listed one by one. -->
    <section id="tab-graph" class="admin-panel hidden">
      <div class="admin-tools">
        <div class="graph-chips-row">
          <div class="admin-chips" id="graphFilter">
            <button class="admin-chip active" data-value="all" type="button">All</button>
            <button class="admin-chip" data-value="Payments In" type="button">Payment Received</button>
            <button class="admin-chip" data-value="Payments Out" type="button">Payment Given</button>
            <button class="admin-chip" data-value="Agency Charge" type="button">Agency Charges</button>
            <button class="admin-chip" data-value="Subscription" type="button">Subscription</button>
          </div>
          <span class="graph-chips-sep" aria-hidden="true"></span>
          <div class="admin-chips" id="graphPeriod">
            <button class="admin-chip" data-value="0" type="button">All Time</button>
            <button class="admin-chip active" data-value="365" type="button">1 Year</button>
            <button class="admin-chip" data-value="180" type="button">6 Month</button>
            <button class="admin-chip" data-value="30" type="button">1 Month</button>
            <button class="admin-chip" data-value="7" type="button">1 Week</button>
          </div>
        </div>
      </div>
      <section class="admin-stats" id="graphStats"></section>
      <div id="graphChart"></div>
    </section>

  </div>
</main>
