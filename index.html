  <main id="homepage">


    <!-- ===================================================

    <!-- ===================================================
         02. HERO
         =================================================== -->

    <div id="home-hero"></div>



    <!-- ===================================================
         02b. TUITIONS AVAILABLE   (NEW)
         ===================================================

  <!-- =====================================================
       HOMEPAGE COMPONENT JAVASCRIPT
       ===================================================== -->


  <!-- -----------------------------------------------------
       01. TOGGLE JAVASCRIPT
       ----------------------------------------------------- -->

  <script src="homepage/toggle/toggle.js"></script>



  <!-- -----------------------------------------------------
       02. HERO JAVASCRIPT
       ----------------------------------------------------- -->

  <script src="homepage/hero/hero.js"></script>



  <!-- -----------------------------------------------------
       03. TUTORS JAVASCRIPT
       ----------------------------------------------------- -->

  <script src="homepage/tutors/tutors.js"></script>



  <!-- -----------------------------------------------------
       04. STUDENTS JAVASCRIPT
       -----------------------------------------------------
       New Students component.
       ----------------------------------------------------- -->

  <!-- =====================================================
       HOMEPAGE COMPONENT LOADER
       =====================================================

       This loader:

       1. Loads Toggle HTML
       2. Loads Hero HTML
       3. Loads Tutors HTML
       4. Loads Students HTML
       5. Initializes each component

       Each component remains independent.

       ===================================================== -->

  <script>

    document.addEventListener(
      "DOMContentLoaded",
      async function () {


        /* =================================================
           COMPONENT LOADER FUNCTION
           =================================================

           This function:

           1. Finds the container.
           2. Fetches the component HTML.
           3. Inserts the HTML.
           4. Initializes the component.

           ================================================= */

        async function loadComponent(
          containerId,
          filePath,
          componentObject,
          componentName
        ) {

          /* -------------------------------------------------
             Find container
             ------------------------------------------------- */

          const container =
            document.getElementById(containerId);


          /* -------------------------------------------------
             Stop if container does not exist
             ------------------------------------------------- */

          if (!container) {
            return;
          }


          try {


            /* -----------------------------------------------
               Load component HTML
               ----------------------------------------------- */

            const response =
              await fetch(filePath);


            /* -----------------------------------------------
               Check response
               ----------------------------------------------- */

            if (!response.ok) {

              throw new Error(
                `Could not load ${filePath}`
              );

            }


            /* -----------------------------------------------
               Insert HTML
               ----------------------------------------------- */

            container.innerHTML =
              await response.text();


            /* -----------------------------------------------
               Initialize component

               IMPORTANT:
               This happens only AFTER the HTML has
               been inserted into the DOM.
               ----------------------------------------------- */

            if (
              componentObject &&
              typeof componentObject.init === "function"
            ) {

              componentObject.init();

            }

          } catch (error) {


            /* -----------------------------------------------
               Component-specific error handling

               One component failing will NOT stop the
               remaining homepage components.
               ----------------------------------------------- */

            console.error(
              `${componentName} component failed to load:`,
              error
            );

          }

        }



        /* =================================================
           WHO IS LOGGED IN
           =================================================
           ""        -> nobody: Student / Tutor toggle shown,
                        exactly as before.
           "student" -> no toggle; student hero; "Meet our
                        Tutors" shown.
           "tutor"   -> no toggle; tutor hero; Tuitions
                        Available right below it; "Meet our
                        Students" shown.
           The toggle comes back as soon as they log out.
           ================================================= */

        const role =
          window.UrbanSession ? window.UrbanSession.role() : "";

        document.body.dataset.role = role || "guest";



        /* =================================================
           01. LOAD TOGGLE  (logged-out visitors only)
           ================================================= */

        if (!role) {

          await loadComponent(
            "home-toggle",
            "homepage/toggle/toggle.html",
            window.ToggleComponent,
            "Toggle"
          );

        } else {

          const toggleBox = document.getElementById("home-toggle");
          if (toggleBox) toggleBox.remove();

        }



        /* =================================================
           02. LOAD HERO
           ================================================= */

        await loadComponent(
          "home-hero",
          "homepage/hero/hero.html",
          window.HeroComponent,
          "Hero"
        );

        if (role && window.HeroComponent) {
          window.HeroComponent.update(role);
        }



        /* =================================================
           02b. TUITIONS AVAILABLE  (logged-in tutor only)
           ================================================= */

        if (role === "tutor") {
          mountTuitions();
        } else {
          const tuitionsBox = document.getElementById("home-tuitions");
          if (tuitionsBox) tuitionsBox.remove();
        }



        /* =================================================
           03. LOAD TUTORS  (not for a logged-in tutor)
           ================================================= */

        if (role !== "tutor") {

          await loadComponent(
            "home-tutors",
            "homepage/tutors/tutors.html",
            window.TutorsComponent,
            "Tutors"
          );

        } else {

          const tutorsBox = document.getElementById("home-tutors");
          if (tutorsBox) tutorsBox.remove();

        }



        /* =================================================
           04. LOAD STUDENTS  (not for a logged-in student)
           ================================================= */

        if (role !== "student") {

          await loadComponent(
            "home-students",
            "homepage/students/students.html",
            window.StudentsComponent,
            "Students"
          );

        } else {

          const studentsBox = document.getElementById("home-students");
          if (studentsBox) studentsBox.remove();

        }



        /* =================================================
           TUITIONS FRAME
           =================================================
           The embedded page reports its own height (so the
           frame never scrolls on its own) and hands its
           toasts to this page so they appear on screen.
           ================================================= */

        function mountTuitions() {

          const box = document.getElementById("home-tuitions");

          if (!box) return;

          box.innerHTML = `
            <section class="home-tuitions" aria-label="Tuitions available">
              <iframe
                id="tuitionsFrame"
                class="home-tuitions-frame"
                src="tutoradvertisement.html?embed=1"
                title="Tuitions available"
                scrolling="no"
              ></iframe>
            </section>
            <div id="homeToast" class="home-toast" role="status"></div>
          `;

          const frame = document.getElementById("tuitionsFrame");

          window.addEventListener("message", function (event) {

            if (event.source !== frame.contentWindow) return;

            const data = event.data || {};

            if (data.type === "urbantutor-embed-height") {
              frame.style.height = Math.max(200, Math.ceil(Number(data.height) || 0)) + "px";
            }

            if (data.type === "urbantutor-embed-toast") {
              const toast = document.getElementById("homeToast");
              toast.textContent = data.message || "";
              toast.classList.toggle("error", !!data.isError);
              toast.classList.add("show");
              clearTimeout(mountTuitions._t);
              mountTuitions._t = setTimeout(() => toast.classList.remove("show"), 3200);
            }

          });

        }


      }
    );

  </script>


</body>

</html>
