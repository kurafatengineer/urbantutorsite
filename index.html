<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Urbantutorsite</title>


  <!-- =====================================================
       GLOBAL COMPONENT STYLES
       ===================================================== -->

  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/footer.css">


  <!-- =====================================================
       TOGGLE COMPONENT STYLES
       ===================================================== -->

  <link rel="stylesheet" href="homepage/toggle/toggle.css">


  <!-- =====================================================
       HERO COMPONENT STYLES
       ===================================================== -->

  <link rel="stylesheet" href="homepage/hero/hero.css">

</head>


<body data-page="home">


  <!-- =====================================================
       GLOBAL HEADER
       ===================================================== -->

  <div id="site-header"></div>



  <!-- =====================================================
       HOMEPAGE
       ===================================================== -->

  <main id="homepage">


    <!-- ===================================================
         01. TOGGLE
         =================================================== -->

    <div id="home-toggle"></div>



    <!-- ===================================================
         02. HERO
         =================================================== -->

    <div id="home-hero"></div>


  </main>



  <!-- =====================================================
       GLOBAL FOOTER
       ===================================================== -->

  <div id="site-footer"></div>



  <!-- =====================================================
       GLOBAL JAVASCRIPT
       ===================================================== -->

  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>



  <!-- =====================================================
       TOGGLE JAVASCRIPT
       ===================================================== -->

  <script src="homepage/toggle/toggle.js"></script>



  <!-- =====================================================
       HERO JAVASCRIPT
       ===================================================== -->

  <script src="homepage/hero/hero.js"></script>



  <!-- =====================================================
       HOMEPAGE COMPONENT LOADER
       ===================================================== -->

  <script>

    document.addEventListener(
      "DOMContentLoaded",
      async function () {


        /* =================================================
           01. LOAD TOGGLE
           ================================================= */

        const toggleContainer =
          document.getElementById("home-toggle");


        if (toggleContainer) {

          try {

            const response =
              await fetch(
                "homepage/toggle/toggle.html"
              );


            if (!response.ok) {

              throw new Error(
                "Could not load toggle.html"
              );

            }


            toggleContainer.innerHTML =
              await response.text();


            /*
             * Initialize Toggle after
             * its HTML has been loaded.
             */

            if (
              window.ToggleComponent &&
              typeof window.ToggleComponent.init ===
                "function"
            ) {

              window.ToggleComponent.init();

            }

          } catch (error) {

            console.error(
              "Toggle component failed to load:",
              error
            );

          }

        }



        /* =================================================
           02. LOAD HERO
           ================================================= */

        const heroContainer =
          document.getElementById("home-hero");


        if (heroContainer) {

          try {

            const response =
              await fetch(
                "homepage/hero/hero.html"
              );


            if (!response.ok) {

              throw new Error(
                "Could not load hero.html"
              );

            }


            heroContainer.innerHTML =
              await response.text();


            /*
             * Initialize Hero after
             * its HTML has been loaded.
             */

            if (
              window.HeroComponent &&
              typeof window.HeroComponent.init ===
                "function"
            ) {

              window.HeroComponent.init();

            }

          } catch (error) {

            console.error(
              "Hero component failed to load:",
              error
            );

          }

        }


      }
    );

  </script>


</body>

</html>
